services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orbitflow
      POSTGRES_PASSWORD: orbitflow
      POSTGRES_DB: orbitflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orbitflow
      MINIO_ROOT_PASSWORD: orbitflow
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
